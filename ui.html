<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MarkXia Note Editor</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --divider-color: rgba(0, 0, 0, 0.05);
      --button-primary: #0186FF;
      --button-primary-hover: #017FF2;
      --text-color: #1A191A;
      --text-muted: #737879;
      --hover-overlay: rgba(0, 0, 0, 0.05);
    }

    body.theme-dark {
      --bg-color: #0F121C;
      --divider-color: rgba(255, 255, 255, 0.08);
      --button-primary: #0186FF;
      --button-primary-hover: #017FF2;
      --text-color: #F1F5F9;
      --text-muted: #94A3B8;
      --hover-overlay: rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      min-height: 0;
    }

    .textarea-wrapper {
      flex: 1;
      position: relative;
      min-height: 0;
      width: 100%;
    }

    .markdown-editor {
      width: 100%;
      height: 100%;
      resize: none;
      background-color: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      color: var(--text-color);
      font-family: "Noto Sans", Arial, sans-serif;
      font-size: 14px;
      line-height: 20px;
      outline: none;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .footer {
      border-top: 1px solid var(--divider-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 16px 24px;
      background-color: var(--bg-color);
      flex-shrink: 0;
    }

    .stats-group {
      display: flex;
      align-items: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 16px;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      width: 80px;
      min-width: 80px;
      height: 32px;
      padding: 8px;
      border-radius: 4px;
      border: 0;
      font-size: 14px;
      font-weight: 400;
      line-height: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
      outline: none;
    }

    .btn-apply {
      background-color: transparent;
      color: var(--text-muted);
    }

    .btn-apply:hover {
      background-color: var(--hover-overlay);
      color: var(--text-color);
    }

    .btn-save {
      background-color: var(--button-primary);
      color: #FFFFFF;
    }

    .btn-save:hover {
      background-color: var(--button-primary-hover);
    }
  </style>
</head>
<body class="theme-light">

  <div class="editor-container">
    <div class="textarea-wrapper">
      <textarea id="markdownEditor" class="markdown-editor" placeholder="Type your markdown here..."></textarea>
    </div>
  </div>

  <div class="footer">
    <div class="stats-group">
      <span id="statsText">0 chars, 0 words</span>
    </div>
    
    <div class="btn-group">
      <button id="applyBtn" class="btn btn-apply" onclick="saveMarkdown(true)">Apply</button>
      <button id="saveBtn" class="btn btn-save" onclick="saveMarkdown(false)">Save</button>
    </div>
  </div>

  <script>
    const markdownEditor = document.getElementById('markdownEditor');
    const statsText = document.getElementById('statsText');
    let currentTitle = 'MarkXia Note';

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (message && message.type === 'init-state') {
        currentTitle = message.title || 'MarkXia Note';
        markdownEditor.value = message.markdown || '';
        
        if (message.theme === 'dark') {
          document.body.classList.remove('theme-light');
          document.body.classList.add('theme-dark');
        } else {
          document.body.classList.remove('theme-dark');
          document.body.classList.add('theme-light');
        }
        
        updateStats();
      }
    };

    markdownEditor.addEventListener('input', updateStats);
    markdownEditor.addEventListener('keydown', handleEditorShortcut);

    function updateStats() {
      const text = markdownEditor.value;
      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      statsText.textContent = `${text.length} chars, ${words.length} words`;
    }

    const formattingShortcuts = [
      {
        isMatch: (event) => event.metaKey && event.shiftKey && !event.altKey && event.key.toLowerCase() === 's',
        apply: () => saveMarkdown(true),
        shouldUpdateStats: false
      },
      {
        isMatch: (event) => event.metaKey && !event.shiftKey && !event.altKey && event.key.toLowerCase() === 's',
        apply: () => saveMarkdown(false),
        shouldUpdateStats: false
      },
      {
        isMatch: (event) => event.metaKey && !event.shiftKey && !event.altKey && event.key.toLowerCase() === 'b',
        apply: () => wrapSelection('**', '**', 'strong')
      },
      {
        isMatch: (event) => event.metaKey && !event.shiftKey && !event.altKey && event.key.toLowerCase() === 'i',
        apply: () => wrapSelection('*', '*', 'emphasis')
      },
      {
        isMatch: (event) => event.metaKey && !event.shiftKey && !event.altKey && event.key.toLowerCase() === 'u',
        apply: () => wrapSelection('<u>', '</u>', 'underline')
      },
      {
        isMatch: (event) => event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey && event.code === 'Backquote',
        apply: () => wrapSelection('`', '`', 'code')
      },
      {
        isMatch: (event) => event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey && event.key.toLowerCase() === 'm',
        apply: () => wrapSelection('$', '$', 'math')
      },
      {
        isMatch: (event) => event.ctrlKey && !event.metaKey && event.shiftKey && !event.altKey && event.code === 'Backquote',
        apply: () => wrapSelection('~~', '~~', 'strike')
      },
      {
        isMatch: (event) => event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey && event.key === '-',
        apply: () => wrapSelection('<!-- ', ' -->', 'comment')
      },
      {
        isMatch: (event) => event.metaKey && !event.shiftKey && !event.altKey && event.key.toLowerCase() === 'k',
        apply: insertLink
      }
    ];

    function handleEditorShortcut(event) {
      const shortcut = formattingShortcuts.find(item => item.isMatch(event));
      if (!shortcut) return;

      event.preventDefault();
      shortcut.apply();
      if (shortcut.shouldUpdateStats !== false) {
        updateStats();
      }
    }

    function wrapSelection(prefix, suffix, placeholder) {
      const start = markdownEditor.selectionStart;
      const end = markdownEditor.selectionEnd;
      const selectedText = markdownEditor.value.slice(start, end);
      const innerText = selectedText || placeholder;
      const replacement = `${prefix}${innerText}${suffix}`;

      replaceEditorRange(start, end, replacement);

      if (selectedText) {
        markdownEditor.setSelectionRange(start + prefix.length, start + prefix.length + selectedText.length);
      } else {
        markdownEditor.setSelectionRange(start + prefix.length, start + prefix.length + placeholder.length);
      }
    }

    function insertLink() {
      const start = markdownEditor.selectionStart;
      const end = markdownEditor.selectionEnd;
      const selectedText = markdownEditor.value.slice(start, end);
      const label = selectedText || 'link';
      const replacement = `[${label}](url)`;

      replaceEditorRange(start, end, replacement);

      if (selectedText) {
        const urlStart = start + replacement.length - 4;
        markdownEditor.setSelectionRange(urlStart, urlStart + 3);
      } else {
        markdownEditor.setSelectionRange(start + 1, start + 1 + label.length);
      }
    }

    function replaceEditorRange(start, end, replacement) {
      const before = markdownEditor.value.slice(0, start);
      const after = markdownEditor.value.slice(end);
      markdownEditor.value = `${before}${replacement}${after}`;
      markdownEditor.focus();
    }

    function saveMarkdown(keepOpen = false) {
      window.parent.postMessage({
        pluginMessage: {
          type: 'save-markdown',
          title: currentTitle,
          markdown: markdownEditor.value,
          keepOpen: keepOpen
        }
      }, '*');
    }
  </script>
</body>
</html>
